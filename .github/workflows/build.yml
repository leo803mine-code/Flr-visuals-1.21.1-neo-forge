name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: unzip -q ./*.zip
      - run: gradle build
        working-directory: QuantumCosmetics-1.21.4
      - run: gh release create v${{ github.run_number }} QuantumCosmetics-1.21.4/build/libs/flr-visuals-1.0.0.jar --title "FLR Visuals" --notes "build"
        env:
          GH_TOKEN: ${{ github.token }}
